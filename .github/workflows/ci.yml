name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @firma-ec/inbox-backend exec prisma generate

      # `apps/verify-api/tests/built-bundle.test.ts` arranca el bundle YA
      # construido y le pide /livez: sin este paso falla con «falta dist/index.js»
      # (a proposito — el test no se salta en silencio cuando falta el artefacto).
      - name: Build verify-api bundle (lo exige built-bundle.test.ts)
        run: pnpm --filter @firma-ec/verify-api build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test (PWA unit — runes-aware, incl. voice regression)
        run: pnpm --filter @firma-ec/pwa run test

      - name: Dead code check (advisory)
        run: pnpm deadcode
        continue-on-error: true

      - name: Audit
        run: pnpm audit --audit-level=high
        continue-on-error: false

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    # Non-blocking for now (dual-review finding, 2026-08-07): 2 full local
    # runs of this suite showed 3/57 tests red each time, with a DIFFERENT
    # set of tests failing per run (timing/load flakiness pre-existing in
    # apps/pwa/tests/e2e/, not caused by this job) — none of it in the files
    # this change touches (aia-fallback.spec.ts passes 5/5 in isolation).
    # Promoting an already-red, non-deterministic suite straight to a hard
    # merge gate would block unrelated PRs on failures that have nothing to
    # do with what they touch, which is its own way of breaking the green
    # baseline for everyone. Flip to blocking once the suite has run clean
    # (or had its known-flaky specs isolated/fixed) over a real stretch of
    # CI runs — this job existing and reporting is the point of this change;
    # gating on it is the next step, not this one.
    continue-on-error: true
    # 3 red tests × retries:2 (playwright.config.ts) run 3× each in series
    # under workers:1 — one alone (firmar-lote-propagacion.spec.ts, a
    # 22,000-page PDF) measured 3×180s=9min on top of an already 3.7-5.9min
    # clean run plus install time. 20 min is tight for exactly the case
    # (red) this timeout exists to bound.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (chromium only)
        run: pnpm --filter @firma-ec/pwa exec playwright install --with-deps chromium

      # `test:e2e` (bare `playwright test`) runs EVERY project in
      # playwright.config.ts, chromium AND mobile — `--project=chromium`
      # here is required, not cosmetic, to actually keep mobile out of this
      # gate and CI time reasonable. Mobile stays a local/manual check
      # (`pnpm --filter @firma-ec/pwa run test:e2e:mobile`).
      - name: E2E tests (chromium)
        run: pnpm --filter @firma-ec/pwa exec playwright test --project=chromium

      # El e2e de arriba levanta `vite dev`, que NO emite Service Worker: por eso
      # el SW reiniciando la app encima del PDF del usuario (0.25.1) pasó toda la
      # suite en verde. Estos specs corren contra `vite preview` sobre el build
      # real, y hasta ahora no los ejecutaba NADIE — vitest los recogía por la
      # extensión y solo fallaba al cargarlos.
      - name: Build PWA (lo exige el e2e del Service Worker)
        run: pnpm --filter @firma-ec/pwa build

      - name: E2E Service Worker (build real, no vite dev)
        run: pnpm --filter @firma-ec/pwa run test:e2e:sw

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/pwa/playwright-report/
            apps/pwa/test-results/
          retention-days: 7
