<!doctype html>
<html lang="es" data-theme-default="light">
  <head>
    <script>
      // Theme bootstrap (v0.5.1) — default LIGHT, dark only via manual toggle.
      // Runs first to avoid FOUC. Never reads prefers-color-scheme.
      // Legacy 'system' or any non-'dark' value collapses to light (migration).
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          document.documentElement.dataset.theme = saved === 'dark' ? 'dark' : 'light';
        } catch (_) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <script>
      // Trusted Types default policy (hotfix v0.2.1).
      // Required because CSP `require-trusted-types-for 'script'` blocks:
      //   - new Worker(new URL('./verify.worker.ts', import.meta.url))
      //   - navigator.serviceWorker.register('/sw.js')
      // Same-origin URLs and the OCSP proxy origin are explicitly allowed.
      // Any other origin throws — keeps DOM-XSS sink hardening intact.
      if (window.trustedTypes && window.trustedTypes.createPolicy) {
        window.trustedTypes.createPolicy('default', {
          createScriptURL: function (url) {
            var u = new URL(url, location.origin);
            if (u.origin === location.origin) return url;
            if (u.origin === 'https://ocsp.firmar.ec') return url;
            throw new Error('Trusted Types blocked URL: ' + url);
          },
          createScript: function (s) { return s; },
          createHTML: function (s) { return s; }
        });
      }
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- color-scheme is driven by html[data-theme] via CSS. Default light, dark opt-in. -->
    <title>firmar.ec — app</title>
    <meta name="description" content="App de firma y verificación de PDFs con tu certificado ecuatoriano." />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
