version: "3.9"

# firmar.ec — F0 Swarm stack
#
# Aprendizajes del cluster IDK incorporados:
# - overlay nativo IDK = IASERVER_NET (NO traefik_public — esa red no existe en este cluster)
# - Traefik v3 swarm provider rechaza si se mezclan labels traefik.docker.* y traefik.swarm.*
#   → dejar SOLO traefik.swarm.network ; quitar traefik.docker.network entirely
# - Anti-pattern Swarm deadlock conocido: start-first + max_replicas_per_node=1 + replicas==nodos
#   → usar update_config.order=stop-first (golpeó 9 stacks documentados; ver memoria
#     project_swarm_stopfirst_deadlock_fix_2026-05-03)
# - IAS01/02/03 son los 3 manager nodes; IASERVER01 puede estar en drain por diseño en
#   ciertos momentos. NO pinear node.hostname; usar node.role==manager para que Swarm
#   reparta entre 02/03 si IAS01 está drained.
# - Registry primario IDK: <REGISTRY> (interno, accesible desde el overlay).
#   GHCR es mirror público para visibilidad OSS / SLSA / Cosign release artifact.
#
# Middlewares cargados por file provider de Traefik desde infra/traefik/middlewares.yml
# (placed in the Traefik dynamic provider directory on swarm-nfs). Suffix @file es correcto.

networks:
  IASERVER_NET:
    external: true

services:
  landing:
    image: ${REGISTRY:?REGISTRY no definido}/firma-ec-landing:${TAG:-dev}
    networks: [IASERVER_NET]
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.role == manager
      resources:
        limits: { cpus: '0.5', memory: 128M }
        reservations: { cpus: '0.05', memory: 32M }
      labels:
        - traefik.enable=true
        - traefik.swarm.network=IASERVER_NET
        - traefik.http.routers.firma-landing.rule=Host(`firmar.ec`) || Host(`www.firmar.ec`)
        - traefik.http.routers.firma-landing.entrypoints=websecure
        - traefik.http.routers.firma-landing.tls=true
        - traefik.http.services.firma-landing.loadbalancer.server.port=8080
        - traefik.http.services.firma-landing.loadbalancer.healthcheck.path=/
        - traefik.http.services.firma-landing.loadbalancer.healthcheck.interval=15s
        - traefik.http.services.firma-landing.loadbalancer.passhostheader=true
        - traefik.http.routers.firma-landing.middlewares=firma-headers@file,firma-ratelimit@file

  pwa:
    image: ${REGISTRY:?REGISTRY no definido}/firma-ec-pwa:${TAG:-dev}
    networks: [IASERVER_NET]
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.role == manager
      resources:
        limits: { cpus: '0.5', memory: 128M }
        reservations: { cpus: '0.05', memory: 32M }
      labels:
        - traefik.enable=true
        - traefik.swarm.network=IASERVER_NET
        - traefik.http.routers.firma-pwa.rule=Host(`app.firmar.ec`)
        - traefik.http.routers.firma-pwa.entrypoints=websecure
        - traefik.http.routers.firma-pwa.tls=true
        - traefik.http.services.firma-pwa.loadbalancer.server.port=8080
        - traefik.http.services.firma-pwa.loadbalancer.healthcheck.path=/
        - traefik.http.services.firma-pwa.loadbalancer.healthcheck.interval=15s
        - traefik.http.services.firma-pwa.loadbalancer.passhostheader=true
        - traefik.http.routers.firma-pwa.middlewares=firma-pwa-headers@file,firma-ratelimit@file

# NOTA: el backend de usage-stats vive en su PROPIO stack dedicado
# infra/compose/stack-firma-ec-stats.deploy.yml (stack `firma-ec-stats`), separado
# a propósito de este stack para no acoplar tags ni arriesgar un redeploy de
# landing/pwa. NO añadir el servicio stats aquí.
