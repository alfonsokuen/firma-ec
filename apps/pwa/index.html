<!doctype html>
<html lang="es">
  <head>
    <script>
      // Trusted Types default policy (hotfix v0.2.1).
      // Required because CSP `require-trusted-types-for 'script'` blocks:
      //   - new Worker(new URL('./verify.worker.ts', import.meta.url))
      //   - navigator.serviceWorker.register('/sw.js')
      // Same-origin URLs and the OCSP proxy origin are explicitly allowed.
      // Any other origin throws — keeps DOM-XSS sink hardening intact.
      if (window.trustedTypes && window.trustedTypes.createPolicy) {
        window.trustedTypes.createPolicy('default', {
          createScriptURL: function (url) {
            var u = new URL(url, location.origin);
            if (u.origin === location.origin) return url;
            if (u.origin === 'https://ocsp.firmar.ec') return url;
            throw new Error('Trusted Types blocked URL: ' + url);
          },
          createScript: function (s) { return s; },
          createHTML: function (s) { return s; }
        });
      }
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>firmar.ec — app</title>
    <meta name="description" content="App de firma y verificación de PDFs con tu certificado ecuatoriano." />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
