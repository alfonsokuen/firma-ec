name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  build-sign-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Build all
        run: pnpm build

      - name: Generate SBOM (CycloneDX 1.6)
        uses: anchore/sbom-action@v0
        with:
          path: '.'
          format: cyclonedx-json
          output-file: 'sbom.cyclonedx.json'
          artifact-name: sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM (SPDX 2.3)
        uses: anchore/sbom-action@v0
        with:
          path: '.'
          format: spdx-json
          output-file: 'sbom.spdx.json'
          artifact-name: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0
        with: { cosign-release: 'v2.4.1' }

      - name: Hash artifacts
        id: hash
        working-directory: ${{ github.workspace }}
        run: |
          tar -czf landing.tar.gz -C apps/landing/dist .
          tar -czf pwa.tar.gz -C apps/pwa/dist .
          sha256sum landing.tar.gz pwa.tar.gz sbom.cyclonedx.json sbom.spdx.json > checksums.txt
          cat checksums.txt

      - name: Sign artifacts with Cosign (keyless via OIDC)
        run: |
          set -euo pipefail
          sign_one() {
            local f="$1"
            local attempt=1
            until [ "$attempt" -gt 4 ]; do
              if cosign sign-blob --yes "$f" --output-signature "$f.sig" --output-certificate "$f.pem"; then
                return 0
              fi
              echo "::warning::cosign sign-blob $f attempt $attempt failed, retrying after backoff"
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            return 1
          }
          for f in landing.tar.gz pwa.tar.gz sbom.cyclonedx.json sbom.spdx.json checksums.txt; do
            sign_one "$f"
          done

      - name: Generate SLSA build provenance attestation (L2 baseline + L3 elements)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            landing.tar.gz
            pwa.tar.gz
            sbom.cyclonedx.json
            sbom.spdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            landing.tar.gz
            landing.tar.gz.sig
            landing.tar.gz.pem
            pwa.tar.gz
            pwa.tar.gz.sig
            pwa.tar.gz.pem
            sbom.cyclonedx.json
            sbom.cyclonedx.json.sig
            sbom.spdx.json
            sbom.spdx.json.sig
            checksums.txt
            checksums.txt.sig
          generate_release_notes: true
