name = "firmar-ec-stats"
main = "src/main.ts"
compatibility_date = "2026-05-01"
workers_dev = false

# Same-origin as the landing → the counter fetch needs no CORS. Path-scoped so
# everything else on firmar.ec still flows through the tunnel to Traefik.
routes = [
  { pattern = "firmar.ec/api/stats*", zone_name = "firmar.ec" },
  { pattern = "www.firmar.ec/api/stats*", zone_name = "firmar.ec" }
]

# KV holds only two integers (sign / verify totals) + short-lived per-IP rate
# counters. No PII. `id` is filled in after `wrangler kv namespace create STATS`.
[[kv_namespaces]]
binding = "STATS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
