tls:
  certificates:
    - certFile: /etc/traefik/certs/idk_cert.pem
      keyFile: /etc/traefik/certs/idk_key.pem
    - certFile: /etc/traefik/certs/moneccu_cert.pem
      keyFile: /etc/traefik/certs/moneccu_key.pem
    - certFile: /etc/traefik/certs/puntual_cert.pem
      keyFile: /etc/traefik/certs/puntual_key.pem

http:
  routers:
    unifi-controller:
      rule: "Host(`unifi.idkmanager.com`)"
      entryPoints:
        - websecure
      service: unifi-controller
      tls: {}
  services:
    unifi-controller:
      loadBalancer:
        serversTransport: insecure
        servers:
          - url: "https://190.160.10.146:8443"
  serversTransports:
    insecure:
      insecureSkipVerify: true

  middlewares:
    firma-headers:
      headers:
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        browserXssFilter: false
        referrerPolicy: "no-referrer"
        customFrameOptionsValue: "DENY"
        contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-hashes' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
        customResponseHeaders:
          Permissions-Policy: "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), clipboard-write=(), interest-cohort=()"
          Cross-Origin-Opener-Policy: "same-origin"
          Cross-Origin-Embedder-Policy: "credentialless"
          Cross-Origin-Resource-Policy: "same-origin"

    firma-pwa-headers:
      headers:
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        referrerPolicy: "no-referrer"
        customFrameOptionsValue: "DENY"
        contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://ocsp.firmar.ec https://freetsa.org; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'; upgrade-insecure-requests"
        customResponseHeaders:
          Permissions-Policy: "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), clipboard-write=(self), web-share=(self), interest-cohort=()"
          Cross-Origin-Opener-Policy: "same-origin"
          Cross-Origin-Embedder-Policy: "credentialless"
          Cross-Origin-Resource-Policy: "same-origin"
          X-Robots-Tag: "noindex, nofollow"

    firma-ratelimit:
      rateLimit:
        average: 100
        burst: 50
        period: 1s
