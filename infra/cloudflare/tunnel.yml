# Cloudflare Tunnel config for firma-ec
# Deploy alongside existing tunnels at /mnt/swarm-nfs/cloudflared/firma-ec/ on Swarm NFS.
# Credentials JSON (TUNNEL_ID.json) lives next to this file; never commit it.
tunnel: firma-ec
credentials-file: /etc/cloudflared/firma-ec.json

ingress:
  # firmar.ec apex + www → Traefik (Swarm) on the host running cloudflared
  - hostname: firmar.ec
    service: https://traefik:443
    originRequest:
      originServerName: firmar.ec
      noTLSVerify: false
  - hostname: www.firmar.ec
    service: https://traefik:443
    originRequest:
      originServerName: www.firmar.ec
      noTLSVerify: false
  - hostname: app.firmar.ec
    service: https://traefik:443
    originRequest:
      originServerName: app.firmar.ec
      noTLSVerify: false
  # API publica de verificacion de firmas (piloto). Mismo Traefik que el resto.
  - hostname: api.firmar.ec
    service: https://traefik:443
    originRequest:
      originServerName: api.firmar.ec
      noTLSVerify: false
  - hostname: status.firmar.ec
    service: https://traefik:443
    originRequest:
      originServerName: status.firmar.ec
      noTLSVerify: false
  # Catch-all
  - service: http_status:404
