<!doctype html>
<html lang="es" data-theme-default="light">
  <head>
    <script>
      // Theme bootstrap — default LIGHT, but follow the device when the user
      // has not chosen. Priority: explicit choice (localStorage 'theme' =
      // 'light'|'dark') wins; otherwise match prefers-color-scheme (dark
      // device → dark), falling back to light. Runs first to avoid FOUC.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme;
          if (saved === 'dark' || saved === 'light') {
            theme = saved;
          } else {
            theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
        } catch (_) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <script>
      // Trusted Types default policy (hotfix v0.2.1).
      // Required because CSP `require-trusted-types-for 'script'` blocks:
      //   - new Worker(new URL('./verify.worker.ts', import.meta.url))
      //   - navigator.serviceWorker.register('/sw.js')
      // Same-origin URLs and the OCSP proxy origin are explicitly allowed.
      // Any other origin throws — keeps DOM-XSS sink hardening intact.
      if (window.trustedTypes && window.trustedTypes.createPolicy) {
        window.trustedTypes.createPolicy('default', {
          createScriptURL: function (url) {
            var u = new URL(url, location.origin);
            if (u.origin === location.origin) return url;
            if (u.origin === 'https://ocsp.firmar.ec') return url;
            throw new Error('Trusted Types blocked URL: ' + url);
          },
          createScript: function (s) { return s; },
          createHTML: function (s) { return s; }
        });
      }
    </script>
    <script>
      // Early `beforeinstallprompt` capture (Android/Chromium).
      // Chrome dispara este evento muy temprano en la carga — antes de que
      // Svelte monte. Si no lo capturamos aquí, en `onMount` ya se perdió y el
      // botón "Instalar app" cae a la guía manual en vez del prompt nativo.
      // Lo guardamos en window para que installState lo recoja en start().
      // 100% client-side (LOPDP): no se envía nada, solo se retiene el evento.
      window.__deferredBIP = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredBIP = e;
      });
      window.addEventListener('appinstalled', function () {
        window.__deferredBIP = null;
      });
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- color-scheme is driven by html[data-theme] via CSS. Default light, dark opt-in. -->
    <title>firmar.ec — app</title>
    <meta name="description" content="App de firma y verificación de PDFs con tu certificado electrónico .p12 (ECI ARCOTEL). 100% en tu navegador, sin servidores." />
    <!-- OpenGraph -->
    <meta property="og:title" content="firmar.ec — app" />
    <meta property="og:description" content="Firma y verifica PDFs con tu certificado electrónico .p12. PAdES B-T, 100% client-side." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.firmar.ec/" />
    <meta property="og:image" content="https://app.firmar.ec/og-app-firmar-ec.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_EC" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="firmar.ec — app" />
    <meta name="twitter:description" content="Firma y verifica PDFs con tu certificado electrónico .p12. PAdES B-T, 100% client-side." />
    <meta name="twitter:image" content="https://app.firmar.ec/og-app-firmar-ec.png" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- iOS: Safari no expone `beforeinstallprompt`; "Anadir a pantalla de inicio" es
         manual y lee ESTAS etiquetas, no el manifest. Sin apple-touch-icon el icono
         cae a una captura de la pagina; sin el title usa el <title> completo. -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-title" content="firmar.ec" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0B1A3A" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
