name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  build-sign-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @firma-ec/inbox-backend exec prisma generate

      # Reproducible-builds — pin all timestamps to the tag commit so two
      # runs of the same tag produce byte-identical tarballs (modulo build
      # tooling that doesn't honour SOURCE_DATE_EPOCH; see docs/reproducible-builds.md).
      - name: Compute SOURCE_DATE_EPOCH from tag commit
        id: sde
        run: |
          set -euo pipefail
          SDE="$(git log -1 --pretty=%ct)"
          echo "SOURCE_DATE_EPOCH=$SDE" >> "$GITHUB_ENV"
          echo "value=$SDE" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$SDE ($(date -u -d @$SDE +%Y-%m-%dT%H:%M:%SZ))"

      - name: Build all
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        run: pnpm build

      - name: Generate SBOM (CycloneDX 1.6)
        uses: anchore/sbom-action@v0
        with:
          path: '.'
          format: cyclonedx-json
          output-file: 'sbom.cyclonedx.json'
          artifact-name: sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM (SPDX 2.3)
        uses: anchore/sbom-action@v0
        with:
          path: '.'
          format: spdx-json
          output-file: 'sbom.spdx.json'
          artifact-name: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0
        with: { cosign-release: 'v2.4.1' }

      - name: Hash artifacts (deterministic tar — sorted, owner stripped, mtime pinned)
        id: hash
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        run: |
          set -euo pipefail
          # Deterministic tar invariants (Reproducible Builds best practice):
          # --sort=name  : stable file ordering across runs/filesystems
          # --owner=0 --group=0 --numeric-owner : strip per-runner UID/GID
          # --mtime=@$SDE : pin file mtime to commit timestamp
          # GNU tar is what Ubuntu runners ship; if migrating to BSD tar, switch flags.
          TAR_FLAGS=(--sort=name --owner=0 --group=0 --numeric-owner "--mtime=@${SOURCE_DATE_EPOCH}")
          # gzip -n strips the embedded timestamp/filename (also non-determinism source)
          tar "${TAR_FLAGS[@]}" -cf landing.tar -C apps/landing/dist . && gzip -n -9 landing.tar
          tar "${TAR_FLAGS[@]}" -cf pwa.tar     -C apps/pwa/dist .     && gzip -n -9 pwa.tar
          sha256sum landing.tar.gz pwa.tar.gz sbom.cyclonedx.json sbom.spdx.json > checksums.txt
          cat checksums.txt

      - name: Sign artifacts with Cosign (keyless via OIDC)
        run: |
          set -euo pipefail
          sign_one() {
            local f="$1"
            local attempt=1
            until [ "$attempt" -gt 4 ]; do
              if cosign sign-blob --yes "$f" --output-signature "$f.sig" --output-certificate "$f.pem"; then
                return 0
              fi
              echo "::warning::cosign sign-blob $f attempt $attempt failed, retrying after backoff"
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            return 1
          }
          for f in landing.tar.gz pwa.tar.gz sbom.cyclonedx.json sbom.spdx.json checksums.txt; do
            sign_one "$f"
          done

      - name: Generate SLSA build provenance attestation (L2 baseline + L3 elements)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            landing.tar.gz
            pwa.tar.gz
            sbom.cyclonedx.json
            sbom.spdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            landing.tar.gz
            landing.tar.gz.sig
            landing.tar.gz.pem
            pwa.tar.gz
            pwa.tar.gz.sig
            pwa.tar.gz.pem
            sbom.cyclonedx.json
            sbom.cyclonedx.json.sig
            sbom.spdx.json
            sbom.spdx.json.sig
            checksums.txt
            checksums.txt.sig
          generate_release_notes: true
